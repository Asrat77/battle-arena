# Kamal deploy to the single EC2 host from deploy/terraform. kamal-proxy
# terminates HTTPS for both hosts (and for any other app on this server), so
# there is no Caddy. Update with `kamal deploy`; see deploy/README.md.
service: battle-arena
image: asrat77/battle-arena

# Hosts and the builder use the server's Tailscale address: port 22 on the
# public IP is closed. The public names stay in the proxy hosts below.
servers:
  web:
    hosts:
      - 100.85.9.76
    cmd: npm run start -- -p 3000
    proxy:
      host: 34.252.38.138.sslip.io
      app_port: 3000
      ssl: true
      healthcheck:
        path: /
  api:
    hosts:
      - 100.85.9.76
    cmd: npm run server
    env:
      clear:
        PORT: 3001
        FRONTEND_URL: https://34.252.38.138.sslip.io
        DATA_FILE: /data/db.json
        # kamal-proxy sits in front, so rate limits must see the real client IP.
        TRUST_PROXY: "1"
        STORE: postgres
      secret:
        - LEDGER_PRIVATE_KEY
        # Neon Postgres: pooled URL for the app, direct URL for `npm run migrate`.
        - DATABASE_URL
        - DATABASE_URL_UNPOOLED
        # Staked matches (see README). WALLET_MODE=real needs REAL_MONEY_LEGAL_OK=1 too (see deploy/README.md).
        - WALLET_MODE
        - VERIFY_ET_KEY
        - DEPOSIT_TELEBIRR
        - DEPOSIT_CBE
        - TELEGRAM_BOT_TOKEN
        - TELEGRAM_MODERATOR_CHAT
        - REAL_MONEY_LEGAL_OK
        - ADMIN_TOKEN
        - STORE
    proxy:
      host: api.34.252.38.138.sslip.io
      app_port: 3001
      ssl: true
      healthcheck:
        path: /health

# Profiles and the ledger. The volume Docker Compose created, so data carries over.
volumes:
  - battle-arena_arena-data:/data

registry:
  server: ghcr.io
  username: Asrat77
  password:
    - KAMAL_REGISTRY_PASSWORD

builder:
  arch: amd64
  # Build on the server itself: it is amd64, the Mac is not. The GitHub deploy
  # workflow sets ARENA_BUILD_LOCAL=1 and builds on its own amd64 runner.
<% if ENV["ARENA_BUILD_LOCAL"] == "1" %>
  # Each runner starts with an empty Docker cache, so keep the build layers
  # (npm modules, Next.js build) in the registry next to the app image, under
  # the build-cache tag. Unchanged layers are then reused, not rebuilt.
  cache:
    type: registry
    image: asrat77/battle-arena:build-cache
    options: mode=max,image-manifest=true,oci-mediatypes=true
<% else %>
  remote: ssh://ubuntu@100.85.9.76
<% end %>
  args:
    # NEXT_PUBLIC_* values are baked into the browser bundle at build time.
    NEXT_PUBLIC_API_URL: https://api.34.252.38.138.sslip.io

ssh:
  user: ubuntu
  keys:
    - <%= ENV.fetch("ARENA_SSH_KEY", "~/.ssh/battle-arena") %>
