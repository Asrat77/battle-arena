name: CI

on:
  pull_request:
  push:
    branches: [ main ]

# Lint + tests and the production build run as two jobs at the same time;
# together they used to take ~3 minutes in a row.
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # Node 22: `node --test` expands the "**/*.test.ts" glob only from Node 21 on.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Next.js reuses compiled output from .next/cache when sources are unchanged.
      - name: Restore Next.js build cache
        uses: actions/cache@v6
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-

      - name: Build
        env:
          NEXT_PUBLIC_API_URL: https://api.34.252.38.138.sslip.io
        run: npm run build
